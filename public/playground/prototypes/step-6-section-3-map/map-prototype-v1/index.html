<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Kumamoto Investment Opportunities</title>

    <!-- The MoreHarvest M mark in the browser tab (brand.md 5). The artwork was
         decided and saved but never linked, so the tab fell back to the
         browser's blank-page icon. Vite fingerprints and bundles it, so it
         ships inside the snapshot and needs no network. -->
    <link rel="icon" type="image/svg+xml" href="./assets/favicon-CV9UEKej.svg" />

    <!-- Both fonts (Rem and Noto Sans JP) are self-hosted and declared in
         css/styles.css, so the page requests nothing from a third party. -->

    <!-- App CSS. Mapbox GL JS's own stylesheet is imported by js/main.js so it
         is bundled rather than fetched from api.mapbox.com. -->

    <!-- Mapbox GL JS and Chart.js are bundled into the app module, not loaded
         from a CDN. Two CDN script tags used to sit here: they made the app
         unable to boot with no network, which the embedded snapshot inside
         value-add-prototype depends on (process.md 2.2). See js/main.js. -->
    <script type="module" crossorigin src="./assets/index-BdIMczFv.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C5_PoIp9.css">
  </head>
  <body>
    <!-- Embed-mode behavior (data-embed / data-embed-host / data-chromeless
         attributes, iPhone bottom sheet, valueadd postMessage contract, setup
         cover, click intercepts) now lives in `js/map-core/` and is applied
         by `mountMap` based on the resolved `embedHost` option. URL fallbacks
         (`?embed=1`, `?host=valueadd`, `?chromeless=1`) preserved by
         `js/map-core/options.js`. See docs/architecture-and-sync-workflow.md
         and docs/plans/map-core-extraction-execution-plan.md. -->

    <style>
      /* Dev tools are always hidden in any embed mode. */
      [data-embed="1"] #camera-explorer-toggle,
      [data-embed="1"] #camera-explorer,
      [data-embed="1"] #step-jumper-toggle,
      [data-embed="1"] #step-jumper,
      [data-embed="1"] #layers-toggle {
        display: none !important;
      }

      /* Language toggle is hidden in every embed context (iPhone and
         value-add). The other three controls below are hidden only in
         the iPhone embed; the value-add host keeps them visible. */
      [data-embed="1"] #lang-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #panel-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #time-toggle,
      [data-embed="1"]:not([data-embed-host="valueadd"]) #journey-progress {
        display: none !important;
      }

      /* Dev-only QA tool toggle. Cmd+Shift+1 flips data-dev-hidden on <html>
         so the local presenter can clear the screen without leaving the
         browser. Handler is gated by import.meta.env.DEV in main.js, so this
         attribute is only ever set in development. */
      [data-dev-hidden="1"] #camera-explorer-toggle,
      [data-dev-hidden="1"] #camera-explorer,
      [data-dev-hidden="1"] #step-jumper-toggle,
      [data-dev-hidden="1"] #step-jumper {
        display: none !important;
      }

      /* ───── Embed mode: iPhone 17 Pro frame ─────
         Matches the JSX PhoneFrame used by the other playground
         prototypes. The iframe viewport is 440 x 900 (playground
         constant). We paint the neutral page on <html>, center a
         380 x 732 bezel on <body>, and the app fills the 368 x 720
         screen inside. The `transform` on body makes body the
         containing block for descendants with `position: fixed`,
         so the right panel, gallery, and overlays stay inside the
         phone screen instead of escaping to the iframe viewport. */
      [data-embed="1"] {
        background: #EDEEF1;
      }
      html[data-embed="1"] {
        min-height: 100%;
      }
      [data-embed="1"] body {
        width: 380px;
        height: 732px;
        padding: 6px;
        margin: 0 auto;
        box-sizing: border-box;
        background: #1e1f20;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        transform: translate(0, 0);
      }
      [data-embed="1"] #app-container {
        position: relative;
        top: auto;
        left: auto;
        width: 100%;
        height: 100%;
        border-radius: 40px;
        overflow: hidden;
        background: #F9F9F9;
      }
      [data-embed="1"] #map-container {
        border-radius: 40px;
        overflow: hidden;
      }

      /* Full-screen modal overlays stay inside the phone screen. The
         bottom sheet (#right-panel) and the nav arrows are styled in
         embed-mobile.css. */
      [data-embed="1"] #gallery-modal,
      [data-embed="1"] #property-quick-look,
      [data-embed="1"] #evidence-preview {
        position: absolute;
        inset: 0;
        width: auto;
        height: auto;
        border-radius: 40px;
        overflow: hidden;
      }

      /* ───── value-add-prototype embed host overrides ─────
         Activated by ?embed=1&host=valueadd. Overrides the iPhone phone
         frame above and lets the iframe fill its container, the slideshow
         draws its own iPad frame around the iframe. */
      [data-embed-host="valueadd"] {
        background: #F9F9F9;
      }
      html[data-embed-host="valueadd"],
      [data-embed-host="valueadd"] body {
        width: 100%;
        height: 100%;
        min-height: 0;
        margin: 0;
        padding: 0;
        overflow: hidden;
        box-sizing: border-box;
      }
      [data-embed-host="valueadd"] body {
        background: #F9F9F9;
        border-radius: 0;
        box-shadow: none;
        position: relative;
        transform: translate(0, 0);
      }
      [data-embed-host="valueadd"] #app-container {
        border-radius: 0;
      }
      [data-embed-host="valueadd"] #map-container {
        border-radius: 0;
      }
      [data-embed-host="valueadd"] #gallery-modal,
      [data-embed-host="valueadd"] #property-quick-look,
      [data-embed-host="valueadd"] #evidence-preview {
        border-radius: 0;
      }

      /* Chromeless mode (toggled via ?chromeless=1 or postMessage). Hides
         every interactive overlay so the map reads as a pure visual
         surface during transitions. */
      [data-chromeless="1"] #right-panel,
      [data-chromeless="1"] #nav-arrows,
      [data-chromeless="1"] #view-mode-toggle,
      [data-chromeless="1"] #lang-toggle {
        display: none !important;
      }
    </style>

    <!-- Intro screen. Shown on the standalone app only: the embedded map in
         value-add-prototype opens on a step and never sees it. -->

5731%2045.8651%2018.9582%2048.3185%2016.7543C51.0208%2014.327%2051.2043%2010.5335%2048.7404%208.0431C45.6819%204.95198%2040.6306%206.01285%2039.0374%2010.0778C38.9631%2010.2676%2038.9981%2010.5185%2038.6392%2010.691V10.6906Z'%20fill='url(%23paint1_linear_1_181)'/%3e%3cdefs%3e%3clinearGradient%20id='paint0_linear_1_181'%20x1='32.2182'%20y1='-2.02546e-06'%20x2='-2.35867'%20y2='4.09781'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%23FBB931'/%3e%3cstop%20offset='1'%20stop-color='%23FF8660'/%3e%3c/linearGradient%3e%3clinearGradient%20id='paint1_linear_1_181'%20x1='55.9996'%20y1='0.137327'%20x2='21.6733'%20y2='4.21983'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%23FBB931'/%3e%3cstop%20offset='1'%20stop-color='%23FF8660'/%3e%3c/linearGradient%3e%3c/defs%3e%3c/svg%3e" alt="MoreHarvest" />
        <h1 class="start-screen-title">Welcome to MoreHarvest</h1>
        <p class="start-screen-subtitle">
          Nine investment properties in Kumamoto, Japan, beside TSMC's new fab.
        </p>
        <button id="start-btn" class="start-screen-cta" type="button">
          Start The Tour
        </button>
      </div>
    </div>

    <!-- Main App Container -->
    <div id="app-container">
      <!-- Map Container -->
      <div id="map-container" tabindex="-1">
        <div
          id="map"
          role="application"
          aria-label="Kumamoto investment area map"
        ></div>
        <!-- Screen reader announcements for map interactions -->
        <div
          id="map-announcements"
          class="sr-only"
          aria-live="polite"
          aria-atomic="true"
        ></div>

        <!-- Journey Progress Bar (populated dynamically by UI.updateJourneyProgress) -->
        <nav
          id="journey-progress"
          class="hidden"
          role="progressbar"
          aria-valuemin="1"
          aria-label="Journey progress"
        ></nav>

        <!-- Time Toggle -->
        <div
          id="time-toggle"
          class="hidden"
          role="radiogroup"
          aria-label="Map time view"
        >
          <button
            id="present-btn"
            class="time-btn active"
            role="radio"
            aria-checked="true"
          >
            Now
          </button>
          <button
            id="future-btn"
            class="time-btn"
            role="radio"
            aria-checked="false"
          >
            Future
          </button>
        </div>

        <!-- Nav arrows (replaces chatbox + FAB) -->
        <div class="nav-arrows" id="nav-arrows" style="display: none;">
          <button class="nav-btn back" id="nav-back" aria-label="Previous step">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <button class="nav-btn forward" id="nav-forward" aria-label="Next step">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

        <!-- The layers control ships (owner ruling, 2026-07-27). It is shown to
             the user only in Q&A mode, step 11, per layout.md 8; showDataLayers()
             decides that, not the build. Both elements sat inside DEV-ONLY
             markers until now, so production had no layer controls on any step
             and step 11 silently lost a documented feature. -->
        <!-- Layers Toggle Button (hidden until journey starts) -->
        <button
          id="layers-toggle"
          class="hidden"
          aria-label="Toggle map layers"
          aria-expanded="false"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </button>


        <!-- Data Layers Panel (journey-aware, toggled by button) -->
        <div
          id="data-layers"
          class="hidden"
          role="region"
          aria-label="Data layers"
        >
          <div class="layers-title">Data layers</div>
          <div class="layer-items" id="data-layer-items">
            <!-- Populated by JS - includes both map layers and data layers -->
          </div>
        </div>

        

        

        <!-- Dashboard Toggle Button (right side) -->
        <button
          id="panel-toggle"
          class="hidden"
          aria-label="Toggle dashboard"
          aria-expanded="false"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="18" height="18" x="3" y="3" rx="2" />
            <path d="M15 3v18" />
          </svg>
        </button>

        <!-- Dashboard Toggle Button - removed in v2 overhaul -->
      </div>

      <!-- Dashboard -->
      <aside
        id="right-panel"
        class="hidden"
        role="complementary"
        aria-label="Dashboard"
      >
        <div class="panel-toolbar">
          <button id="panel-home" class="hidden" aria-label="Back to dashboard home">
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
          <button id="panel-close" aria-label="Close dashboard">
            <svg
              aria-hidden="true"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="panel-content"></div>
      </aside>
    </div>

    <!-- Gallery Modal -->
    <div
      id="gallery-modal"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gallery-title"
    >
      <div id="gallery-overlay"></div>
      <div id="gallery-content">
        <button id="gallery-close" aria-label="Close gallery">
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <h2 id="gallery-title" class="sr-only">Document viewer</h2>
        <div id="gallery-body"></div>
      </div>
    </div>

    <!-- Property Image Quick Look Modal (macOS pattern) -->
    <div
      id="property-quick-look"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Property image viewer"
    >
      <div
        id="quick-look-overlay"
        onclick="UI.hidePropertyImageQuickLook()"
      ></div>
      <div id="quick-look-content">
        <button
          id="quick-look-close"
          aria-label="Close image"
          onclick="UI.hidePropertyImageQuickLook()"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <img id="quick-look-image" src="" alt="" />
      </div>
    </div>

    <!-- Evidence Preview Overlay -->
    <div
      id="evidence-preview"
      class="hidden"
      role="dialog"
      aria-modal="true"
      aria-label="Evidence preview"
    >
      <div
        id="evidence-preview-overlay"
        onclick="UI.hideEvidencePreview()"
      ></div>
      <div id="evidence-preview-content">
        <button
          id="evidence-preview-close"
          aria-label="Close preview"
          onclick="UI.hideEvidencePreview()"
        >
          <svg
            aria-hidden="true"
            width="20"
            height="20"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="14" y1="2" x2="2" y2="14"></line>
            <line x1="2" y1="2" x2="14" y2="14"></line>
          </svg>
        </button>
        <div id="evidence-preview-body"></div>
      </div>
    </div>

         `mountMap` via `window.MAPBOX_ACCESS_TOKEN` before
         `MapController.init()` runs. -->

    <!-- Language toggle removed: the app is English only. -->

  </body>
</html>
